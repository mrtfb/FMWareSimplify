<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="FMWARE wordmark">
  <title>FMWARE — Wordmark</title>

  <!-- Transparent-friendly black background -->
  <rect width="1200" height="360" fill="#0a0a0a"/>

  <!-- Minimal accent: single orange underscore + dot -->
  <text x="600" y="210"
        font-family="'Helvetica Neue', 'Arial Black', 'Inter', sans-serif"
        font-weight="900"
        font-size="180"
        letter-spacing="10"
        text-anchor="middle"
        fill="#ffffff">FMWARE</text>

  <!-- Orange underscore beneath the wordmark -->
  <rect x="380" y="240" width="440" height="6" rx="3" fill="#FF6A1A"/>
  <!-- Orange dot to the right (signature accent) -->
  <circle cx="845" cy="243" r="9" fill="#FF6A1A"/>

  <!-- Tiny tagline -->
  <text x="600" y="290"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-weight="500"
        font-size="18"
        letter-spacing="12"
        text-anchor="middle"
        fill="#9e9e9e">EMBEDDED  ·  ENGINEERED  ·  ENABLED</text>
</svg>
