<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="FMWARE primary logo">
  <title>FMWARE — Primary Logo</title>

  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <linearGradient id="traceOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6A1A" stop-opacity="0"/>
      <stop offset="35%" stop-color="#FF6A1A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF8A3D" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="traceOrangeRight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF6A1A" stop-opacity="0"/>
      <stop offset="35%" stop-color="#FF6A1A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF8A3D" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="traceGray" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a7a7a" stop-opacity="0"/>
      <stop offset="40%" stop-color="#9e9e9e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#cfcfcf" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="traceGrayRight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7a7a7a" stop-opacity="0"/>
      <stop offset="40%" stop-color="#9e9e9e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#cfcfcf" stop-opacity="1"/>
    </linearGradient>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <g id="nodeOrange">
      <circle r="7" fill="#0a0a0a" stroke="#FF6A1A" stroke-width="3"/>
    </g>
    <g id="nodeWhite">
      <circle r="6" fill="#0a0a0a" stroke="#ffffff" stroke-width="2.5"/>
    </g>
    <g id="nodeGraySmall">
      <circle r="4" fill="#0a0a0a" stroke="#9e9e9e" stroke-width="2"/>
    </g>
  </defs>

  <rect width="1200" height="700" fill="url(#bgGlow)"/>

  <!-- LEFT TRACES -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-width="4">
    <path d="M 40 230 L 200 230 L 240 270 L 360 270" stroke="url(#traceOrange)"/>
    <path d="M 40 350 L 220 350 L 250 380 L 360 380" stroke="url(#traceGray)"/>
    <path d="M 40 470 L 200 470 L 240 430 L 360 430" stroke="url(#traceOrange)" stroke-opacity="0.85"/>
    <path d="M 120 230 L 120 180 L 160 180" stroke="url(#traceGray)" stroke-width="3"/>
    <path d="M 160 350 L 160 310 L 195 310" stroke="url(#traceOrange)" stroke-width="3" stroke-opacity="0.7"/>
    <path d="M 100 470 L 100 520 L 150 520" stroke="url(#traceGray)" stroke-width="3"/>
  </g>

  <g filter="url(#nodeGlow)">
    <use href="#nodeOrange" x="40" y="230"/>
    <use href="#nodeWhite"  x="40" y="350"/>
    <use href="#nodeOrange" x="40" y="470"/>
    <use href="#nodeGraySmall" x="160" y="180"/>
    <use href="#nodeGraySmall" x="195" y="310"/>
    <use href="#nodeGraySmall" x="150" y="520"/>
  </g>

  <!-- RIGHT TRACES -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-width="4">
    <path d="M 1160 230 L 1000 230 L 960 270 L 840 270" stroke="url(#traceOrangeRight)"/>
    <path d="M 1160 350 L 980 350 L 950 380 L 840 380" stroke="url(#traceGrayRight)"/>
    <path d="M 1160 470 L 1000 470 L 960 430 L 840 430" stroke="url(#traceOrangeRight)" stroke-opacity="0.85"/>
    <path d="M 1080 230 L 1080 180 L 1040 180" stroke="url(#traceGrayRight)" stroke-width="3"/>
    <path d="M 1040 350 L 1040 310 L 1005 310" stroke="url(#traceOrangeRight)" stroke-width="3" stroke-opacity="0.7"/>
    <path d="M 1100 470 L 1100 520 L 1050 520" stroke="url(#traceGrayRight)" stroke-width="3"/>
  </g>

  <g filter="url(#nodeGlow)">
    <use href="#nodeOrange" x="1160" y="230"/>
    <use href="#nodeWhite"  x="1160" y="350"/>
    <use href="#nodeOrange" x="1160" y="470"/>
    <use href="#nodeGraySmall" x="1040" y="180"/>
    <use href="#nodeGraySmall" x="1005" y="310"/>
    <use href="#nodeGraySmall" x="1050" y="520"/>
  </g>

  <!-- TOP & BOTTOM CHIP PINS -->
  <g fill="#FF6A1A">
    <rect x="565" y="120" width="14" height="40" rx="2"/>
    <rect x="593" y="120" width="14" height="40" rx="2"/>
    <rect x="621" y="120" width="14" height="40" rx="2"/>
    <rect x="565" y="540" width="14" height="40" rx="2"/>
    <rect x="593" y="540" width="14" height="40" rx="2"/>
    <rect x="621" y="540" width="14" height="40" rx="2"/>
  </g>
  <g stroke="#FF6A1A" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 600 160 L 600 220"/>
    <path d="M 600 480 L 600 540"/>
  </g>

  <!-- WORDMARK CONTAINER -->
  <rect x="120" y="270" width="960" height="160" rx="20"
        fill="#0a0a0a" stroke="#FF6A1A" stroke-width="3.5"/>

  <text x="600" y="385"
        font-family="'Helvetica Neue', 'Arial Black', 'Inter', sans-serif"
        font-weight="900"
        font-size="130"
        letter-spacing="6"
        text-anchor="middle"
        fill="#ffffff">FMWARE</text>

  <text x="600" y="470"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-weight="500"
        font-size="22"
        letter-spacing="14"
        text-anchor="middle"
        fill="#FF6A1A">FIRMWARE  ·  HARDWARE  ·  SOFTWARE</text>
</svg>
